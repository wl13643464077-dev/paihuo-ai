name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Test suite (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # 全量套件已增长（schema55→57 新增大量用例，本地 M 系列 23 分钟、
    # GitHub runner 实测 40 分钟仍不够），放宽到 75 分钟
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Dependency consistency
        run: python -m pip check

      - name: Install browser runtime
        run: python -m playwright install --with-deps chromium

      - name: Install media runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version

      - name: Prepare owner-controlled test temp root
        run: |
          install -d -m 700 "$RUNNER_TEMP/paihuo-tests"
          echo "TMPDIR=$RUNNER_TEMP/paihuo-tests" >> "$GITHUB_ENV"

      - name: Python syntax
        run: python -m compileall -q app deploy

      - name: JavaScript syntax
        run: for script in static/*.js; do node --check "$script"; done

      - name: Test suite
        run: |
          umask 022
          python scripts/ci_test_suite.py --shards 4 --shard ${{ matrix.shard }}

  # Keep the protected branch's required "test" check stable. Every matrix
  # worker must finish successfully; skipped/cancelled/failed workers fail it.
  test:
    name: test
    if: always()
    needs: suite
    runs-on: ubuntu-latest
    steps:
      - name: Require all test partitions
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
        run: test "$SUITE_RESULT" = success
