name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 全量套件已增长到 20 分钟装不下（schema55→57 新增大量用例），放宽到 40 分钟
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Dependency consistency
        run: python -m pip check

      - name: Install browser runtime
        run: python -m playwright install --with-deps chromium

      - name: Prepare owner-controlled test temp root
        run: |
          install -d -m 700 "$RUNNER_TEMP/paihuo-tests"
          echo "TMPDIR=$RUNNER_TEMP/paihuo-tests" >> "$GITHUB_ENV"

      - name: Python syntax
        run: python -m compileall -q app deploy

      - name: JavaScript syntax
        run: node --check static/app.js

      - name: Test suite
        run: python -m unittest discover -s tests
