name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Dependency consistency
        run: python -m pip check

      - name: Install browser runtime
        run: python -m playwright install --with-deps chromium

      - name: Prepare owner-controlled test temp root
        run: |
          install -d -m 700 "$RUNNER_TEMP/paihuo-tests"
          echo "TMPDIR=$RUNNER_TEMP/paihuo-tests" >> "$GITHUB_ENV"

      - name: Python syntax
        run: python -m compileall -q app deploy

      - name: JavaScript syntax
        run: node --check static/app.js

      - name: Test suite
        run: python -m unittest discover -s tests
