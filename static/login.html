<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 派活</title>
<style>
:root{--ink:#33291f;--cream:#f6efdd;--gold:#ffd166;--accent:#f4a261}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--cream);color:var(--ink);
  min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-y:auto;overflow-x:hidden;position:relative;padding:40px 0}
body:before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(51,41,31,.05) 1.2px,transparent 1.2px);background-size:22px 22px}
.orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.5;animation:drift 14s ease-in-out infinite alternate}
.orb.o1{width:420px;height:420px;background:#ffd16688;top:-120px;left:-100px}
.orb.o2{width:380px;height:380px;background:#f28cb166;bottom:-120px;right:-80px;animation-delay:4s}
.orb.o3{width:300px;height:300px;background:#4cc9f055;top:40%;left:65%;animation-delay:8s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,40px) scale(1.15)}}
.emp{position:fixed;animation:floaty 6s ease-in-out infinite;opacity:.92}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}
.wrap{position:relative;z-index:2;width:min(430px,92vw)}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px}
.bulb{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px 3px #ffd16699;animation:neon 2.1s ease-in-out infinite}
.bulb:last-child{background:#f28cb1;box-shadow:0 0 12px 3px #f28cb199;animation-delay:.7s}
@keyframes neon{0%,100%{opacity:1}50%{opacity:.35}}
h1{font-size:30px;letter-spacing:3px;text-align:center;font-weight:900}
.slogan{text-align:center;color:#8b7355;margin:10px 0 26px;font-size:14.5px;letter-spacing:2px}
.slogan b{color:var(--ink);background:linear-gradient(transparent 62%,var(--gold) 62%)}
.card{background:#fffdf7;border:3px solid var(--ink);border-radius:22px;padding:30px 28px;
  box-shadow:7px 7px 0 rgba(51,41,31,.18);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
label{display:block;font-weight:800;font-size:13px;margin:14px 0 6px}
input,select{width:100%;min-height:44px;border:2.5px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;background:#fff;outline:none;transition:.15s}
select{font-family:inherit;color:var(--ink)}
.creds{margin-top:6px;line-height:1.9}
input:focus,select:focus{box-shadow:3px 3px 0 rgba(51,41,31,.15);transform:translateY(-1px)}
button{width:100%;margin-top:22px;border:3px solid var(--ink);border-radius:14px;padding:13px;font-size:16px;font-weight:900;
  background:var(--gold);cursor:pointer;box-shadow:4px 4px 0 rgba(51,41,31,.2);transition:.12s;letter-spacing:4px}
button:hover{transform:translateY(-2px);box-shadow:6px 6px 0 rgba(51,41,31,.2)}
button:active{transform:translateY(1px);box-shadow:2px 2px 0 rgba(51,41,31,.2)}
.err{color:#e5484d;font-size:13px;text-align:center;margin-top:12px;min-height:18px;font-weight:700}
.foot{text-align:center;margin-top:18px;font-size:12px;color:#a4947c}
.foot a{color:#8b7355}
.alt{display:flex;gap:10px;margin-top:14px}
.alt button{margin-top:0;padding:10px;font-size:13.5px;letter-spacing:1px;background:#fffdf7}
.alt button.tour{background:#e8f6fb}
.applycard{display:none;margin-top:14px}
.purchase-choice{display:none;margin-top:10px;padding:10px 12px;border:2px solid var(--ink);border-radius:11px;background:#fff3c4;font-size:13px;line-height:1.6}
.applycard textarea{width:100%;border:2.5px solid var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;background:#fff;outline:none;min-height:64px;resize:vertical;font-family:inherit}
.tabs{display:none;gap:8px;margin-bottom:6px}
.tabs button{margin-top:0;padding:9px 6px;font-size:14px;letter-spacing:1px;background:#fffdf7;box-shadow:none;border-width:2.5px}
.tabs button.on{background:var(--gold);box-shadow:3px 3px 0 rgba(51,41,31,.18)}
.codeline{display:flex;gap:8px}
.codeline input{flex:1;min-width:0}
.codeline button{width:auto;flex:0 0 auto;margin-top:0;padding:0 12px;font-size:13.5px;letter-spacing:0;min-height:44px;box-shadow:none}
.codeline button:disabled{opacity:.6;cursor:default;transform:none}
#sms-pane{display:none}
.ok{color:#2c8a4b;font-size:13.5px;text-align:center;margin-top:12px;font-weight:800;min-height:18px}
@media(max-width:640px){
  body{padding:24px 0}
  .emp{display:none}
  .card{padding:24px 20px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<svg class="emp" style="top:12%;left:8%" width="90" height="96" viewBox="0 0 120 128"><path d="M28 112 Q22 46 60 41 Q98 46 92 112 Z" fill="#f4a261" stroke="#33291f" stroke-width="3.5"/><circle cx="47" cy="64" r="4" fill="#33291f"/><circle cx="73" cy="64" r="4" fill="#33291f"/><path d="M52 76 q8 8 16 0" stroke="#33291f" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M40 88 Q40 112 40 112 L80 112 Q80 88 80 88 Q70 96 60 96 Q50 96 40 88 Z" fill="#fffaf0" stroke="#33291f" stroke-width="3"/></svg>
<svg class="emp" style="top:18%;right:9%;animation-delay:1.5s" width="74" height="79" viewBox="0 0 120 128"><path d="M28 112 Q22 46 60 41 Q98 46 92 112 Z" fill="#4cc9f0" stroke="#33291f" stroke-width="3.5"/><circle cx="47" cy="64" r="4" fill="#33291f"/><circle cx="73" cy="64" r="4" fill="#33291f"/><path d="M56 78 q4 3.4 8 0" stroke="#33291f" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
<svg class="emp" style="bottom:14%;left:14%;animation-delay:3s" width="66" height="70" viewBox="0 0 120 128"><path d="M28 112 Q22 46 60 41 Q98 46 92 112 Z" fill="#cdb4db" stroke="#33291f" stroke-width="3.5"/><circle cx="47" cy="64" r="4" fill="#33291f"/><circle cx="73" cy="64" r="4" fill="#33291f"/><path d="M52 76 q8 8 16 0" stroke="#33291f" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
<svg class="emp" style="bottom:20%;right:16%;animation-delay:4.5s" width="82" height="87" viewBox="0 0 120 128"><path d="M28 112 Q22 46 60 41 Q98 46 92 112 Z" fill="#90be6d" stroke="#33291f" stroke-width="3.5"/><circle cx="47" cy="64" r="4" fill="#33291f"/><circle cx="73" cy="64" r="4" fill="#33291f"/><path d="M56 78 q4 3.4 8 0" stroke="#33291f" stroke-width="3" fill="none" stroke-linecap="round"/></svg>

<div class="wrap">
  <div class="logo"><span class="bulb"></span><h1>派 活</h1><span class="bulb"></span></div>
  <div class="slogan"><b>老板会派活，数字员工去干活</b> · 11 大连锁行业·专属决策员工听您调遣</div>
  <div class="card">
    <div class="tabs" id="login-tabs" role="tablist">
      <button type="button" id="tab-pw" class="on" role="tab" aria-selected="true" onclick="switchMode('pw')">账号密码登录</button>
      <button type="button" id="tab-sms" role="tab" aria-selected="false" onclick="switchMode('sms')">手机验证码登录</button>
    </div>
    <div id="pw-pane">
      <label for="u">账号</label>
      <input id="u" placeholder="您的账号" autocomplete="username">
      <label for="p">密码</label>
      <input id="p" type="password" placeholder="您的密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')go()">
      <button id="login-btn" onclick="go()">进 入 集 团</button>
    </div>
    <div id="sms-pane">
      <label for="sms-phone">手机号</label>
      <input id="sms-phone" type="tel" inputmode="numeric" maxlength="11" placeholder="开通账号时用的手机号" autocomplete="tel">
      <label for="sms-code">验证码</label>
      <div class="codeline">
        <input id="sms-code" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code" onkeydown="if(event.key==='Enter')smsLogin()">
        <button type="button" id="sms-send" onclick="smsSend()">获取验证码</button>
      </div>
      <button id="sms-login-btn" onclick="smsLogin()">进 入 集 团</button>
    </div>
    <div class="err" id="err" role="status" aria-live="polite"></div>
    <div class="ok" id="sms-ok" role="status" aria-live="polite" style="margin-top:0"></div>
    <div class="alt">
      <button onclick="toggleApply()">📝 申请开通账号</button>
      <button class="tour" onclick="goTour(this)">👀 游客参观(只看不用)</button>
    </div>
  </div>
  <div class="card applycard" id="applycard">
    <b style="font-size:15px">📝 申请开通账号</b>
    <div style="font-size:12.5px;color:#8b7355;margin-top:4px">符合体验条件会即时开通；其他申请转人工审核,我们会在 1 个工作日内反馈</div>
    <div class="purchase-choice" id="purchase-choice" role="status"></div>
    <label>手机号 *</label><input id="a-phone" placeholder="11 位手机号">
    <label>怎么称呼您</label><input id="a-name" placeholder="如:王老板">
    <label>店名 / 企业名</label><input id="a-co" placeholder="如:王记火锅 / 小美美甲工作室" maxlength="60">
    <label for="a-ind">您做哪一行</label>
    <select id="a-ind" onchange="industryChanged()"><option value="">请选择您的行业</option><option value="other">其他</option></select>
    <input id="a-ind-text" placeholder="写一下您做什么生意,如:奶茶店 / 健身房" maxlength="30" style="display:none;margin-top:8px">
    <label>想用派活做什么(选填)</label><textarea id="a-note" placeholder="如:想让数字员工帮我做内容和新店选址"></textarea>
    <button onclick="applyGo(this)">提 交 申 请</button>
    <div class="err" id="a-err" role="status" aria-live="polite"></div><div class="ok" id="a-ok" role="status" aria-live="polite"></div>
  </div>
  <div class="foot">副账号:开通与重置密码都请找您的企业主 · <span id="forgot-line">主账号忘记密码?联系顾问重置</span> · <a href="/promo">了解产品 →</a></div>
</div>
<script>
const PURCHASE_PLAN_LABELS={trial:"体验版",startup:"创业版",biz:"企业版",flagship:"旗舰版"};
const PURCHASE_PERIOD_LABELS={month:"月付",quarter:"季付",year:"年付"};
function selectedPurchase(){
  const params=new URLSearchParams(location.search);
  const fromUrl={plan:params.get("plan"),period:params.get("period"),source:params.get("source")||"login"};
  if(PURCHASE_PLAN_LABELS[fromUrl.plan]&&PURCHASE_PERIOD_LABELS[fromUrl.period]) return fromUrl;
  try{
    const cached=JSON.parse(localStorage.getItem("paihuo:pending-purchase")||"null");
    if(PURCHASE_PLAN_LABELS[cached?.plan]&&PURCHASE_PERIOD_LABELS[cached?.period]) return cached;
  }catch(_){}
  return null;
}
function showSelectedPurchase(){
  const selected=selectedPurchase();
  if(!selected) return;
  try{localStorage.setItem("paihuo:pending-purchase",JSON.stringify({...selected,created_at:Date.now()}));}catch(_){}
  const choice=document.getElementById("purchase-choice");
  choice.style.display="block";
  choice.textContent=`已选择：${PURCHASE_PLAN_LABELS[selected.plan]} · ${PURCHASE_PERIOD_LABELS[selected.period]}。先登录或申请账号，进入套餐页后提交购买申请；此处不会扣款。`;
  const card=document.getElementById("applycard");
  card.style.display="block";
  const note=document.getElementById("a-note");
  const prefix=`[购买意向] ${PURCHASE_PLAN_LABELS[selected.plan]}·${PURCHASE_PERIOD_LABELS[selected.period]}`;
  if(note&&!note.value.includes("[购买意向]")) note.value=prefix;
}
showSelectedPurchase();
// FastAPI 参数校验失败(422)时 detail 是数组,统一翻成人话,别弹 [object Object]
function errText(detail, fallback){
  if(typeof detail==="string"&&detail) return detail;
  if(Array.isArray(detail)&&detail.length){
    const first=detail[0]||{};
    const field=Array.isArray(first.loc)?first.loc.filter(x=>x!=="body").join("."):"";
    return "填写的内容格式不对"+(field?"("+field+")":"")+",请检查后再提交";
  }
  if(detail&&typeof detail==="object"){
    const text=detail.message||detail.msg||detail.detail;
    if(typeof text==="string"&&text) return text;
  }
  return fallback||"操作失败,请稍后再试";
}
function industryChanged(){
  const sel=document.getElementById("a-ind"), other=document.getElementById("a-ind-text");
  other.style.display = sel.value==="other" ? "block" : "none";
}
// 行业下拉:来自不需要登录的公开接口;接口不可用时只剩「其他」+自由文本兜底
fetch("/api/guest/industries").then(r=>r.ok?r.json():null).then(d=>{
  const sel=document.getElementById("a-ind"), other=sel.querySelector('option[value="other"]');
  (d&&Array.isArray(d.industries)?d.industries:[]).forEach(x=>{
    if(!x||!x.key) return;
    const opt=document.createElement("option");
    opt.value=String(x.key); opt.textContent=String(x.name||x.key);
    sel.insertBefore(opt, other);
  });
}).catch(()=>{});
fetch("/api/support-contact").then(r=>r.json()).then(d=>{
  if(d.contact){ const el=document.getElementById("forgot-line");
    if(el) el.textContent = "忘记密码?联系顾问重置:" + d.contact; }
}).catch(()=>{});

async function go(){
  const _b=document.getElementById('login-btn'); if(_b){ if(_b.disabled) return; _b.disabled=true; const _t=_b.textContent; _b.textContent='登录中…'; setTimeout(()=>{_b.disabled=false;_b.textContent=_t;}, 8000); }
  const err = document.getElementById('err'); err.textContent = '';
  try{
    const r = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:document.getElementById('u').value.trim(),password:document.getElementById('p').value})});
    if(!r.ok){ const j = await r.json().catch(()=>({})); err.textContent = errText(j.detail,'登录失败'); return; }
    location.href = selectedPurchase() ? '/#/billing' : '/';
  }catch(e){ err.textContent = '网络异常,稍后再试'; }
}
// 第 1 期:短信验证码登录。后台没配置/没打开时接口回 enabled:false,页面保持只有密码登录。
fetch("/api/auth/login/sms/config").then(r=>r.ok?r.json():null).then(d=>{
  if(d&&d.enabled) document.getElementById("login-tabs").style.display="flex";
}).catch(()=>{});
function switchMode(mode){
  const sms = mode==='sms';
  document.getElementById('pw-pane').style.display = sms ? 'none' : 'block';
  document.getElementById('sms-pane').style.display = sms ? 'block' : 'none';
  document.getElementById('tab-pw').classList.toggle('on', !sms);
  document.getElementById('tab-sms').classList.toggle('on', sms);
  document.getElementById('tab-pw').setAttribute('aria-selected', String(!sms));
  document.getElementById('tab-sms').setAttribute('aria-selected', String(sms));
  document.getElementById('err').textContent='';
  document.getElementById('sms-ok').textContent='';
  document.getElementById(sms ? 'sms-phone' : 'u').focus();
}
let smsTimer=null;
function smsCountdown(seconds){
  const btn=document.getElementById('sms-send');
  let left=Math.max(1, Number(seconds)||60);
  clearInterval(smsTimer);
  btn.disabled=true; btn.textContent=left+' 秒后重发';
  smsTimer=setInterval(()=>{
    left-=1;
    if(left<=0){ clearInterval(smsTimer); btn.disabled=false; btn.textContent='重新获取'; return; }
    btn.textContent=left+' 秒后重发';
  },1000);
}
async function smsSend(){
  const err=document.getElementById('err'), ok=document.getElementById('sms-ok');
  err.textContent=''; ok.textContent='';
  const phone=document.getElementById('sms-phone').value.trim();
  if(!/^1\d{10}$/.test(phone)){ err.textContent='请填 11 位手机号'; return; }
  const btn=document.getElementById('sms-send'); btn.disabled=true;
  try{
    const r=await fetch('/api/auth/login/sms/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){
      err.textContent=errText(j.detail,'获取验证码失败,稍后再试');
      const wait=Number(r.headers.get('Retry-After')||0);
      if(r.status===429&&wait>0&&wait<=120) smsCountdown(wait); else btn.disabled=false;
      return;
    }
    ok.textContent=j.msg||'验证码已发送';
    smsCountdown(j.cooldown||60);
    document.getElementById('sms-code').focus();
  }catch(e){ err.textContent='网络异常,稍后再试'; btn.disabled=false; }
}
async function smsLogin(){
  const err=document.getElementById('err'); err.textContent='';
  const phone=document.getElementById('sms-phone').value.trim();
  const code=document.getElementById('sms-code').value.trim();
  if(!/^1\d{10}$/.test(phone)){ err.textContent='请填 11 位手机号'; return; }
  if(!/^\d{6}$/.test(code)){ err.textContent='请填 6 位验证码'; return; }
  const btn=document.getElementById('sms-login-btn');
  if(btn.disabled) return;
  btn.disabled=true; const t=btn.textContent; btn.textContent='登录中…';
  try{
    const r=await fetch('/api/auth/login/sms/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,code})});
    if(!r.ok){ const j=await r.json().catch(()=>({})); err.textContent=errText(j.detail,'登录失败'); return; }
    location.href = selectedPurchase() ? '/#/billing' : '/';
  }catch(e){ err.textContent='网络异常,稍后再试'; }
  finally{ btn.disabled=false; btn.textContent=t; }
}
function toggleApply(){
  const c = document.getElementById('applycard');
  c.style.display = c.style.display==='block' ? 'none' : 'block';
  if(c.style.display==='block') c.scrollIntoView({behavior:'smooth',block:'center'});
}
async function applyGo(btn){
  const err = document.getElementById('a-err'), ok = document.getElementById('a-ok');
  err.textContent=''; ok.textContent='';
  const phone = document.getElementById('a-phone').value.trim();
  if(!/^1\d{10}$/.test(phone)){ err.textContent='请填 11 位手机号'; return; }
  try{localStorage.setItem("paihuo:purchase-contact",phone);}catch(_){}
  btn.disabled = true; btn.textContent = '提交中…';
  try{
    const industry = document.getElementById('a-ind').value;
    const r = await fetch('/api/guest/apply',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone, name:document.getElementById('a-name').value.trim(),
        company:document.getElementById('a-co').value.trim(), industry,
        industry_text: industry==='other' ? document.getElementById('a-ind-text').value.trim() : '',
        note:document.getElementById('a-note').value.trim()})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(errText(j.detail,'提交失败'));
    if(j.account){   // 自动开通:凭据当场给,并帮客户填好登录框(一律 textContent,不拼 HTML)
      ok.replaceChildren();
      const line = (parts)=>{ const div=document.createElement('div'); div.className='creds';
        parts.forEach(([text,bold])=>{ const el=document.createElement(bold?'b':'span'); el.textContent=String(text??''); div.appendChild(el); });
        ok.appendChild(div); };
      line([['🎉 ' + (j.msg||'体验账号已开通')]]);
      line([['账号:'],[j.account.username,true],[' 初始密码:'],[j.account.password,true]]);
      line([['👉 已帮您填进上面登录框,截图保存好密码,点「进入集团」开工!']]);
      if(document.getElementById('pw-pane').style.display==='none') switchMode('pw');
      document.getElementById('u').value = j.account.username;
      document.getElementById('p').value = j.account.password;
      document.getElementById('u').scrollIntoView({behavior:'smooth',block:'center'});
    } else {
      ok.textContent = '✅ ' + (j.msg||'申请已收到,我们会尽快联系您');
    }
    btn.textContent = '已 提 交';
  }catch(e){ err.textContent = e.message; btn.disabled=false; btn.textContent='提 交 申 请'; }
}
async function goTour(btn){
  btn.disabled = true; btn.textContent = '开门中…';
  try{
    const r = await fetch('/api/guest/tour',{method:'POST'});
    if(!r.ok) throw new Error('进入失败,稍后再试');
    location.href = '/';
  }catch(e){ document.getElementById('err').textContent = e.message; btn.disabled=false; btn.textContent='👀 游客参观(只看不用)'; }
}
</script>
</body>
</html>
